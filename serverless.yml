service: routine-app-backend
useDotenv: true

custom:
  routinesTableName: routine-app-dev-routines
  completionsTableName: routine-app-dev-routine-completions
  dailySummariesTableName: routine-app-dev-daily-summaries
  gamificationStateTableName: routine-app-dev-gamification-state
provider:
  name: aws
  runtime: nodejs18.x
  region: eu-central-1
  stage: dev

  httpApi:
    authorizers:
      devRequestAuthorizer:
        type: request
        functionName: authorizeDevRequest
        enableSimpleResponses: true
        payloadVersion: "2.0"
        identitySource:
          - $request.header.X-Routine-Dev-Key

  environment:
    ROUTINES_TABLE_NAME: ${self:custom.routinesTableName}
    COMPLETIONS_TABLE_NAME: ${self:custom.completionsTableName}
    DAILY_SUMMARIES_TABLE_NAME: ${self:custom.dailySummariesTableName}
    GAMIFICATION_STATE_TABLE_NAME: ${self:custom.gamificationStateTableName}
    APP_TIME_ZONE: Europe/Istanbul
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:ConditionCheckItem
            - dynamodb:TransactWriteItems
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.routinesTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.routinesTableName}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.completionsTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.completionsTableName}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.dailySummariesTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.dailySummariesTableName}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.gamificationStateTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.gamificationStateTableName}/index/*
functions:
  authorizeDevRequest:
    handler: src/handlers/authorizeDevRequest.handler
    environment:
      DEV_API_TOKEN: ${env:ROUTINE_APP_DEV_API_TOKEN}
      DEV_ALLOWED_SOURCE_IP: ${env:ROUTINE_APP_DEV_ALLOWED_SOURCE_IP}

  createRoutine:
    handler: src/handlers/createRoutine.handler
    events:
      - httpApi:
          path: /routines
          method: post
          authorizer:
            name: devRequestAuthorizer

  listRoutines:
    handler: src/handlers/listRoutines.handler
    events:
      - httpApi:
          path: /routines
          method: get
          authorizer:
            name: devRequestAuthorizer

  listRoutineTemplates:
    handler: src/handlers/listRoutineTemplates.handler
    events:
      - httpApi:
          path: /routine-templates
          method: get
          authorizer:
            name: devRequestAuthorizer

  applyRoutineTemplate:
    handler: src/handlers/applyRoutineTemplate.handler
    events:
      - httpApi:
          path: /routine-templates/{id}/apply
          method: post
          authorizer:
            name: devRequestAuthorizer
  
  getRoutine:
    handler: src/handlers/getRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}
          method: get
          authorizer:
            name: devRequestAuthorizer

  getRoutineHistory:
    handler: src/handlers/getRoutineHistory.handler
    events:
      - httpApi:
          path: /routines/{id}/history
          method: get
          authorizer:
            name: devRequestAuthorizer

  updateRoutine:
    handler: src/handlers/updateRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}
          method: put
          authorizer:
            name: devRequestAuthorizer

  archiveRoutine:
    handler: src/handlers/archiveRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}/archive
          method: post      
          authorizer:
            name: devRequestAuthorizer

  getToday:
    handler: src/handlers/getToday.handler
    events:
      - httpApi:
          path: /today
          method: get          
          authorizer:
            name: devRequestAuthorizer

  completeRoutine:
    handler: src/handlers/completeRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}/complete
          method: post        
          authorizer:
            name: devRequestAuthorizer

  skipRoutine:
    handler: src/handlers/skipRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}/skip
          method: post      
          authorizer:
            name: devRequestAuthorizer

  listSummaries:
    handler: src/handlers/listSummaries.handler
    events:
      - httpApi:
          path: /summaries
          method: get          
          authorizer:
            name: devRequestAuthorizer

  getSummaryByDate:
    handler: src/handlers/getSummaryByDate.handler
    events:
      - httpApi:
          path: /summaries/{date}
          method: get
          authorizer:
            name: devRequestAuthorizer

  getStreak:
    handler: src/handlers/getStreak.handler
    events:
      - httpApi:
          path: /streak
          method: get
          authorizer:
            name: devRequestAuthorizer

  getInsights:
    handler: src/handlers/getInsights.handler
    events:
      - httpApi:
          path: /insights
          method: get
          authorizer:
            name: devRequestAuthorizer

  getDashboard:
    handler: src/handlers/getDashboard.handler
    events:
      - httpApi:
          path: /dashboard
          method: get
          authorizer:
            name: devRequestAuthorizer

  finalizeSummaryByDate:
    handler: src/handlers/finalizeSummaryByDate.handler
    events:
      - httpApi:
          path: /summaries/{date}/finalize
          method: post
          authorizer:
            name: devRequestAuthorizer

  finalizeYesterdaySummary:
    handler: src/handlers/finalizeYesterdaySummary.handler
    events:
      - schedule:
          rate: cron(10 21 * * ? *)
          enabled: true

resources:
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 6
          ThrottlingRateLimit: 3
