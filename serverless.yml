service: routine-app-backend

custom:
  routinesTableName: routine-app-dev-routines
  completionsTableName: routine-app-dev-routine-completions
  dailySummariesTableName: routine-app-dev-daily-summaries
  gamificationStateTableName: routine-app-dev-gamification-state
provider:
  name: aws
  runtime: nodejs18.x
  region: eu-central-1
  stage: dev

  environment:
    ROUTINES_TABLE_NAME: ${self:custom.routinesTableName}
    COMPLETIONS_TABLE_NAME: ${self:custom.completionsTableName}
    DAILY_SUMMARIES_TABLE_NAME: ${self:custom.dailySummariesTableName}
    GAMIFICATION_STATE_TABLE_NAME: ${self:custom.gamificationStateTableName}
    APP_TIME_ZONE: Europe/Istanbul
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:TransactWriteItems
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.routinesTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.routinesTableName}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.completionsTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.completionsTableName}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.dailySummariesTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.dailySummariesTableName}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.gamificationStateTableName}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.gamificationStateTableName}/index/*
functions:
  createRoutine:
    handler: src/handlers/createRoutine.handler
    events:
      - httpApi:
          path: /routines
          method: post

  listRoutines:
    handler: src/handlers/listRoutines.handler
    events:
      - httpApi:
          path: /routines
          method: get

  listRoutineTemplates:
    handler: src/handlers/listRoutineTemplates.handler
    events:
      - httpApi:
          path: /routine-templates
          method: get
  
  getRoutine:
    handler: src/handlers/getRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}
          method: get

  updateRoutine:
    handler: src/handlers/updateRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}
          method: put

  archiveRoutine:
    handler: src/handlers/archiveRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}/archive
          method: post      

  getToday:
    handler: src/handlers/getToday.handler
    events:
      - httpApi:
          path: /today
          method: get          

  completeRoutine:
    handler: src/handlers/completeRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}/complete
          method: post        

  skipRoutine:
    handler: src/handlers/skipRoutine.handler
    events:
      - httpApi:
          path: /routines/{id}/skip
          method: post      

  listSummaries:
    handler: src/handlers/listSummaries.handler
    events:
      - httpApi:
          path: /summaries
          method: get          

  getSummaryByDate:
    handler: src/handlers/getSummaryByDate.handler
    events:
      - httpApi:
          path: /summaries/{date}
          method: get

  getStreak:
    handler: src/handlers/getStreak.handler
    events:
      - httpApi:
          path: /streak
          method: get

  getInsights:
    handler: src/handlers/getInsights.handler
    events:
      - httpApi:
          path: /insights
          method: get

  finalizeSummaryByDate:
    handler: src/handlers/finalizeSummaryByDate.handler
    events:
      - httpApi:
          path: /summaries/{date}/finalize
          method: post          
